name: Deploy

# Push to master → read the server's env file → build → upload → PM2 reload (auto-rollback if unhealthy)
# The env file lives ONLY on the server: /opt/maitreya/shared/.env (edit it there, then redeploy).
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm # same CPU as the Oracle server
    env:
      HOST: ${{ secrets.HOST }}
      USER: ${{ secrets.USER }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Connect to server
        env:
          KEY: ${{ secrets.KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Read env from server
        # NEXT_PUBLIC_* values are baked into the build, so the build needs the server's env file
        run: |
          ssh -i ~/.ssh/key "$USER@$HOST" "cat /opt/maitreya/shared/.env 2>/dev/null || true" > .env.production
          echo "Loaded $(grep -cE '^[A-Z_]+=' .env.production || true) settings from the server"
          grep -q '^NEXT_PUBLIC_SITE_URL=' .env.production || echo "::warning::Server env file is empty or missing — building with defaults"

      - name: Build
        run: |
          npm ci
          npm run lint
          npm run build
          bash deploy/package.sh "$GITHUB_SHA" release.tgz
          rm -f .env.production

      - name: Deploy
        run: |
          scp -i ~/.ssh/key release.tgz deploy/remote-deploy.sh "$USER@$HOST:/tmp/"
          ssh -i ~/.ssh/key "$USER@$HOST" "bash -lc 'bash /tmp/remote-deploy.sh $GITHUB_SHA /tmp/release.tgz'"

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/key .env.production
