name: Deploy

# Push to master → build → upload to the server → PM2 reload (auto-rollback if unhealthy)
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm # same CPU as the Oracle server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env.production
          npm ci
          npm run lint
          npm run build
          bash deploy/package.sh "$GITHUB_SHA" release.tgz

      - name: Deploy
        env:
          KEY: ${{ secrets.KEY }}
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' "$ENV_FILE" > server.env
          scp -i ~/.ssh/key release.tgz server.env deploy/remote-deploy.sh "$USER@$HOST:/tmp/"
          ssh -i ~/.ssh/key "$USER@$HOST" "bash -lc 'bash /tmp/remote-deploy.sh $GITHUB_SHA /tmp/release.tgz /tmp/server.env'"
          rm -f ~/.ssh/key server.env
