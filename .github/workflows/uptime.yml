name: Uptime

# Every 15 minutes: health endpoint, homepage and SSL expiry for maitreyaevents.com.
# A failed run triggers GitHub's email notification. Enable by setting the
# repository variable UPTIME_ENABLED=true once the domain is live.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: vars.UPTIME_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HOST: maitreyaevents.com
    steps:
      - name: Health endpoint
        run: |
          for i in 1 2 3; do
            if body=$(curl -fsS --max-time 15 "https://$HOST/api/health") && echo "$body" | grep -q '"ok":true'; then
              echo "$body"; exit 0
            fi
            sleep 20
          done
          echo "::error::$HOST is DOWN"
          exit 1

      - name: Homepage responds
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$HOST/")
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Homepage returned $code"; exit 1; }

      - name: SSL certificate valid for 14+ days
        run: |
          end=$(echo | openssl s_client -servername "$HOST" -connect "$HOST:443" 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "Certificate expires in $days days ($end)"
          [ "$days" -ge 14 ] || { echo "::error::Certificate for $HOST expires in $days days"; exit 1; }
